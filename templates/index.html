<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova AI Chatbot</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="app"><aside><div class="brand"><span>✦</span> Nova AI</div><button id="newChat">＋ New conversation</button><div class="about"><b>AI Assistant</b><p>Powered by Google Gemini with secure Flask integration.</p></div><button class="theme" id="theme">◐ Toggle theme</button></aside><section class="chat"><header><div><h1>Nova Assistant</h1><p><i></i> Online and ready to help</p></div><button id="clear">Clear chat</button></header><div id="messages" class="messages"><div class="welcome"><div>✦</div><h2>How can I help you today?</h2><p>Ask a question, get coding help, brainstorm ideas, or learn something new.</p><div class="suggestions"><button>Explain Python functions simply</button><button>Help me prepare for an interview</button><button>Write a professional email</button></div></div></div><form id="chatForm"><div class="composer"><textarea id="input" rows="1" placeholder="Message Nova AI..." required></textarea><button id="send" aria-label="Send">➤</button></div><small>Nova can make mistakes. Verify important information.</small></form></section></main><script src="{{url_for('static',filename='app.js')}}"></script></body></html>
